<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La maison des mimis — Suivi des dépenses</title>
  <meta name="theme-color" content="#151411">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><img class="brand-icon" src="icon-192.png" alt=""><div><h1>Maison 50/50</h1><p>La maison des mimis</p></div></div>
      <button class="secondary" onclick="resetAll()">Réinitialiser</button>
    </header>
    <nav class="topnav" aria-label="Navigation principale">
      <button onclick="show('home')" id="topnav-home"><span class="navico">⌂</span><span>Accueil</span></button>
      <button onclick="show('add')" id="topnav-add"><span class="navico">▣</span><span>Dépenses</span></button>
      <button onclick="show('reimburse')" id="topnav-reimburse"><span class="navico">⇄</span><span>Remboursements</span></button>
      <button onclick="show('history')" id="topnav-history"><span class="navico">◷</span><span>Historique</span></button>
    </nav>
    <main id="root"></main>
  </div>
  <nav class="bottom app-dock" aria-label="Navigation rapide">
    <button onclick="show('home')" id="nav-home" class="dock-item" aria-label="Accueil">
      <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.1a1.1 1.1 0 0 1-1.1 1.1H15v-6H9v6H4.1A1.1 1.1 0 0 1 3 19.9z"/></svg></span><span>Accueil</span>
    </button>
    <button onclick="show('projects')" id="nav-projects" class="dock-item" aria-label="Projets">
      <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h6l1.8 2H20v9.4A1.1 1.1 0 0 1 18.9 20H5.1A1.1 1.1 0 0 1 4 18.9z"/><path d="M4 7.5V5.1A1.1 1.1 0 0 1 5.1 4H9l1.6 1.8"/></svg></span><span>Projets</span>
    </button>
    <button class="fab" onclick="fabAdd(event)" id="quick-add-fab" aria-label="Ajouter une dépense">
      <span class="fab-halo" aria-hidden="true"></span><span class="fab-plus" aria-hidden="true"></span>
    </button>
    <button onclick="show('documents')" id="nav-documents" class="dock-item" aria-label="Documents">
      <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M15 3.5v4h4M9 11h6M9 14.5h6M9 18h4"/></svg></span><span>Documents</span>
    </button>
    <button onclick="show('history')" id="nav-history" class="dock-item" aria-label="Historique">
      <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6v5h5"/><path d="M5.3 17.3A8 8 0 1 0 4.2 9"/><path d="M12 8v4l2.8 1.8"/></svg></span><span>Historique</span>
    </button>
  </nav>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
